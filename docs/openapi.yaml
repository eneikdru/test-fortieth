openapi: 3.1.0
info:
  title: EIOS and LMS Integration API Contract
  description: >
    This API contract specifies the shared integration endpoints, request/response shapes,
    and webhook payloads for LMS metadata, role synchronization, and notification subscriptions
    between the EIOS Knowledge Base and Moodle LMS systems.

    Roles supported inside EIOS:
    - ADMINISTRATOR
    - CONTENT_MANAGER
    - TEACHER
    - LEARNER
  version: 1.0.0
  license:
    name: Proprietary
    url: "https://example.com/license"
servers:
  - url: /api/v1/integration
    description: Default integration base URL

security:
  - bearerAuth: []

paths:
  /lms-metadata:
    get:
      summary: Retrieve all synchronized LMS metadata entries
      description: Returns a list of current metadata entries mapped from the LMS.
      operationId: getLmsMetadata
      parameters:
        - name: externalId
          in: query
          description: Filter metadata by external LMS course or resource identifier
          required: false
          schema:
            type: string
        - name: metadataKey
          in: query
          description: Filter metadata by metadata key
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved LMS metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LmsMetadata'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Bulkupsert LMS metadata mapping
      description: Create or update metadata mappings from the external LMS.
      operationId: upsertLmsMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LmsMetadataUpsert'
      responses:
        '200':
          description: LMS metadata successfully updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LmsMetadata'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /synced-roles:
    get:
      summary: Retrieve role mappings
      description: Returns current external role mappings to internal EIOS identifiers.
      operationId: getSyncedRoles
      responses:
        '200':
          description: Successfully retrieved role mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncedRole'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create or update role mappings
      description: Map an external LMS role identifier to an internal EIOS role identifier.
      operationId: upsertSyncedRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncedRoleUpsert'
      responses:
        '200':
          description: Role mapping successfully saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedRole'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messenger-subscriptions:
    get:
      summary: Retrieve all messenger subscriptions
      description: Returns active notification subscriptions for messenger chats/channels.
      operationId: getMessengerSubscriptions
      parameters:
        - name: userId
          in: query
          description: Filter by target EIOS user ID
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved messenger subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessengerSubscription'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create or update messenger subscription
      description: Register or modify notification subscription parameters.
      operationId: upsertMessengerSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessengerSubscriptionUpsert'
      responses:
        '200':
          description: Messenger subscription successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessengerSubscription'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /documents:
    get:
      summary: Search documents
      description: Search documents with full-text search and filters. Returns a unified set of results including both local KbDocuments and synchronized LmsMetadata.
      operationId: searchDocuments
      parameters:
        - name: query
          in: query
          description: Full-text search query
          required: false
          schema:
            type: string
        - name: documentType
          in: query
          description: Filter by document type
          required: false
          schema:
            type: string
        - name: specialty
          in: query
          description: Filter by specialty
          required: false
          schema:
            type: string
        - name: educationLevel
          in: query
          description: Filter by education level
          required: false
          schema:
            type: string
        - name: updatedAfter
          in: query
          description: Filter by updated after date
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Upload a new document
      description: Upload a new document with its metadata and file.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
      responses:
        '201':
          description: Document successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get a document by ID
      operationId: getDocumentById
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update a document
      operationId: updateDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Document successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a document
      operationId: deleteDocument
      responses:
        '204':
          description: Document successfully deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Document not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /analytics/statistics:
    get:
      summary: Retrieve analytics statistics
      description: Returns analytics data including popular searches, views, and downloads.
      operationId: getAnalyticsStatistics
      responses:
        '200':
          description: Successful retrieval of analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsStatistics'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
webhooks:
  lms_updates:
    post:
      summary: Webhook for incoming LMS metadata/resource updates
      operationId: processLmsWebhook
      description: Invoked by LMS (Moodle) when courses, books, pages, or files are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LmsWebhookPayload'
      responses:
        '200':
          description: Webhook received and processed successfully
        '400':
          description: Invalid payload or signature
        '401':
          description: Unauthorized webhook delivery
  eios_sync:
    post:
      summary: Webhook for outgoing EIOS role sync trigger
      operationId: processEiosWebhook
      description: Invoked by EIOS or sent to the LMS to synchronize role definitions and assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EiosWebhookPayload'
      responses:
        '200':
          description: Webhook acknowledged successfully
        '400':
          description: Invalid sync payload
        '401':
          description: Unauthorized delivery

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LmsMetadata:
      type: object
      required:
        - id
        - externalId
        - metadataKey
      properties:
        id:
          type: integer
          format: int64
          description: Internal database sequence ID
        externalId:
          type: string
          description: Foreign LMS identifier (e.g. course or file identifier)
        metadataKey:
          type: string
          description: Key of the metadata field (e.g. course-code, category-id)
        metadataValue:
          type: string
          description: Value corresponding to the metadata key
        createdAt:
          type: string
          format: date-time
          description: Entity creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last modification timestamp


    Document:
      type: object
      required:
        - id
        - title
        - authorId
        - versionNumber
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: Internal database sequence ID
        title:
          type: string
          description: Document title
        category:
          type: string
          description: Document category
        tags:
          type: array
          items:
            type: string
          description: Associated tags
        authorId:
          type: integer
          format: int64
          description: Author ID
        versionNumber:
          type: integer
          description: Latest version number
        fileType:
          type: string
          description: Type of the latest file version
        filePath:
          type: string
          description: Path/URL to download the document
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentUpload:
      type: object
      required:
        - title
        - file
      properties:
        title:
          type: string
          description: Document title
        category:
          type: string
          description: Document category
        tags:
          type: array
          items:
            type: string
          description: Array of tags
        file:
          type: string
          format: binary
          description: The document file payload

    DocumentUpdate:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: The new document file version

    AnalyticsStatistics:
      type: object
      required:
        - popularSearches
        - topViewedDocuments
        - topDownloadedDocuments
      properties:
        popularSearches:
          type: array
          items:
            type: object
            required:
              - query
              - count
            properties:
              query:
                type: string
              count:
                type: integer
        topViewedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentStats'
        topDownloadedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentStats'

    DocumentStats:
      type: object
      required:
        - documentId
        - title
        - count
      properties:
        documentId:
          type: integer
          format: int64
        title:
          type: string
        count:
          type: integer
    LmsMetadataUpsert:
      type: object
      required:
        - externalId
        - metadataKey
      properties:
        externalId:
          type: string
          description: Foreign LMS identifier (e.g. course or file identifier)
        metadataKey:
          type: string
          description: Key of the metadata field
        metadataValue:
          type: string
          description: Value corresponding to the metadata key

    SyncedRole:
      type: object
      required:
        - id
        - externalRoleName
        - internalEiosIdentifier
      properties:
        id:
          type: integer
          format: int64
          description: Unique mapping identifier
        externalRoleName:
          type: string
          description: Unique name of the role inside the LMS (e.g. 'ext_postgrad_lead')
        internalEiosIdentifier:
          type: string
          enum: [ADMINISTRATOR, CONTENT_MANAGER, TEACHER, LEARNER]
          description: Internal EIOS role designation mapped to the external identifier
        description:
          type: string
          description: Friendly details about this specific role assignment mapping
        createdAt:
          type: string
          format: date-time
          description: Timestamp of mapping registration

    SyncedRoleUpsert:
      type: object
      required:
        - externalRoleName
        - internalEiosIdentifier
      properties:
        externalRoleName:
          type: string
          description: Unique name of the role inside the LMS (e.g. 'ext_postgrad_lead')
        internalEiosIdentifier:
          type: string
          enum: [ADMINISTRATOR, CONTENT_MANAGER, TEACHER, LEARNER]
          description: Internal EIOS role designation mapped to the external identifier
        description:
          type: string
          description: Description or justification of the role mapping

    MessengerSubscription:
      type: object
      required:
        - id
        - userId
        - channelOrChatId
        - notificationType
        - isActive
      properties:
        id:
          type: integer
          format: int64
          description: Subscription record identifier
        userId:
          type: string
          description: Identifies the target user receiving notifications
        channelOrChatId:
          type: string
          description: Address of the channel/group/chat in the messenger service
        notificationType:
          type: string
          description: Type of notifications delivered under this subscription
        isActive:
          type: boolean
          description: Current operational state of this subscription
        createdAt:
          type: string
          format: date-time
          description: Timestamp of registration
        updatedAt:
          type: string
          format: date-time
          description: Last modification timestamp

    MessengerSubscriptionUpsert:
      type: object
      required:
        - userId
        - channelOrChatId
        - notificationType
      properties:
        userId:
          type: string
          description: Identifies the target user receiving notifications
        channelOrChatId:
          type: string
          description: Address of the channel/group/chat in the messenger service
        notificationType:
          type: string
          description: Type of notifications delivered under this subscription
        isActive:
          type: boolean
          default: true
          description: Optional flag to toggle active status

    LmsWebhookPayload:
      type: object
      required:
        - eventType
        - timestamp
        - signature
        - data
      properties:
        eventType:
          type: string
          enum: [COURSE_UPDATED, FILE_UPLOADED, TERM_DEFINED]
          description: The type of event that occurred on LMS
        timestamp:
          type: integer
          format: int64
          description: Event occurrence epoch time in milliseconds
        signature:
          type: string
          description: Cryptographic hash signature to verify authenticity of payload
        data:
          type: object
          properties:
            externalId:
              type: string
              description: External item identifier affected by the change
            metadata:
              type: array
              items:
                $ref: '#/components/schemas/LmsMetadataUpsert'

    EiosWebhookPayload:
      type: object
      required:
        - eventType
        - timestamp
        - data
      properties:
        eventType:
          type: string
          enum: [ROLE_MAPPING_CHANGED, USER_ROLE_UPDATED]
          description: Event type triggering the downstream EIOS sync
        timestamp:
          type: integer
          format: int64
          description: Event occurrence epoch time in milliseconds
        data:
          type: object
          properties:
            userId:
              type: string
              description: Identifier of the user whose assignments were updated
            roles:
              type: array
              items:
                type: string
                description: List of current EIOS roles assigned to the user

    ErrorResponse:
      type: object
      required:
        - errorClass
        - errorCode
        - message
        - timestamp
      properties:
        errorClass:
          type: string
          description: Categorization of the error (e.g. VALIDATION_ERROR, INTEGRATION_ERROR, SECURITY_ERROR)
        errorCode:
          type: string
          description: Precise internal identifier of the specific defect class
        message:
          type: string
          description: Human-readable explanation of the defect context
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp representing when the error was registered

  responses:
    BadRequestError:
      description: Invalid request payload, query parameters, or formatting
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Security token missing, malformed, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Caller lacks required privilege/scope to invoke the target endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unhandled exception or upstream system failure occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
